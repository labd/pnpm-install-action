name: pnpm install
description: Set up Node.js and pnpm, restore the pnpm store cache, audit and install dependencies

inputs:
  node-version:
    description: >-
      Node.js version spec (e.g. "24", "22.x"). When empty, the version is read
      from `node-version-file`, or from `.nvmrc` / `.node-version` in `cwd`,
      falling back to "24".
    required: false
    default: ""
  node-version-file:
    description: >-
      Path (relative to the repository root) to a file containing the Node.js
      version (e.g. `.nvmrc`, `.node-version`, `.tool-versions`, `package.json`).
      Ignored when `node-version` is set.
    required: false
    default: ""
  pnpm-version:
    description: >-
      pnpm version to install. When empty, the `packageManager` field of
      `<cwd>/package.json` is used.
    required: false
    default: ""
  cwd:
    description: Directory containing package.json and pnpm-lock.yaml, relative to the repository root.
    required: false
    default: "."
  cache:
    description: >-
      Restore and save the pnpm store with actions/cache. Set to "false" in
      release/publish workflows to avoid cache poisoning.
    required: false
    default: "true"
  frozen-lockfile:
    description: Run `pnpm install --frozen-lockfile`.
    required: false
    default: "true"
  audit:
    description: Run `pnpm audit --audit-level=critical --ignore-registry-errors` before installing.
    required: false
    default: "true"
  registry-url:
    description: >-
      npm registry URL passed to actions/setup-node (e.g. https://registry.npmjs.org).
      Writes an .npmrc that authenticates with the NODE_AUTH_TOKEN env var, needed for publishing.
    required: false
    default: ""

outputs:
  node-version:
    description: The installed Node.js version.
    value: ${{ steps.setup-node.outputs.node-version }}
  pnpm-store-path:
    description: Path of the pnpm store.
    value: ${{ steps.pnpm-store.outputs.path }}
  cache-hit:
    description: Whether the pnpm store cache had an exact key match (empty when cache is disabled).
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Resolve Node.js version
      id: node-version
      shell: bash
      env:
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
        INPUT_NODE_VERSION_FILE: ${{ inputs.node-version-file }}
        INPUT_CWD: ${{ inputs.cwd }}
      run: |
        version=""
        file=""
        if [ -n "$INPUT_NODE_VERSION" ]; then
          version="$INPUT_NODE_VERSION"
        elif [ -n "$INPUT_NODE_VERSION_FILE" ]; then
          file="$INPUT_NODE_VERSION_FILE"
        elif [ -f "$INPUT_CWD/.nvmrc" ]; then
          file="$INPUT_CWD/.nvmrc"
        elif [ -f "$INPUT_CWD/.node-version" ]; then
          file="$INPUT_CWD/.node-version"
        else
          version="24"
        fi
        echo "Using Node.js ${version:-from $file}"
        {
          echo "version=$version"
          echo "file=$file"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      id: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.node-version.outputs.version }}
        node-version-file: ${{ steps.node-version.outputs.file }}
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}
        package_json_file: ${{ inputs.cwd }}/package.json
        run_install: false

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      working-directory: ${{ inputs.cwd }}
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      id: pnpm-cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles(inputs.cwd == '.' && '**/pnpm-lock.yaml' || format('{0}/**/pnpm-lock.yaml', inputs.cwd)) }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

    - name: Audit dependencies for critical vulnerabilities
      if: inputs.audit == 'true'
      shell: bash
      working-directory: ${{ inputs.cwd }}
      run: pnpm audit --audit-level=critical --ignore-registry-errors

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.cwd }}
      env:
        INPUT_FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
      run: |
        if [ "$INPUT_FROZEN_LOCKFILE" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install --no-frozen-lockfile
        fi
